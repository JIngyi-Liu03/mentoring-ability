# ============================================================================
# 导师辅导能力成熟度自评 —— Nginx 反向代理（真实域名 · HTTP 预配版）
#
# 说明：本文件是给 certbot --nginx 用的【初始 HTTP 版】。执行 setup-https.sh
#       后 certbot 会自动把这两个 server 块改写为 443 + 80→443 跳转，无需手动写 HTTPS。
#
# 放置位置：/etc/nginx/sites-available/  + 软链到 sites-enabled/ + 启 nginx
#
# 反代目标：127.0.0.1:3001（用户端）/ 127.0.0.1:3002（后台端）
#           后端自带托管 dist/user 与 dist/admin，nginx 仅透传，不碰静态文件。
# ============================================================================

# —— 用户端（测评），mentor.empowerdf.com → 127.0.0.1:3001 ——
server {
    listen 80;
    listen [::]:80;
    server_name mentor.empowerdf.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 =200 /index.html;
    }
}

# —— 后台端（管理），mentor-admin.empowerdf.com → 127.0.0.1:3002 ——
server {
    listen 80;
    listen [::]:80;
    server_name mentor-admin.empowerdf.com;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 =200 /index.html;
    }
}
