# ============================================================================
# 导师辅导能力成熟度自评 —— Nginx 反向代理片段（可选，接正式域名时再用）
#
# 使用前提：你已有正式域名（如 empowerdf.com 或新子域名）且想让新工具走 80/443，
#           而不是裸端口 3001。本片段【追加】到旧站点的 Nginx 配置中，作为一个
#           全新的 server 块，不改动旧站点已有的任何 server/location。
#
# 放置位置（二选一）：
#   - 若旧站点用 Docker 里的 Nginx：把它加进旧 Nginx 的 conf.d / 挂载配置后
#     `docker compose restart nginx`（仅重启 nginx 容器，不影响其他）；
#   - 若服务器另装了系统 Nginx：放到 /etc/nginx/sites-available/ 并软链启用，
#     然后 `sudo nginx -t && sudo systemctl reload nginx`。
#
# 重要：本片段反代目标是 127.0.0.1:3001（本工具的 systemd 服务），
#        完全不碰旧站点的 PostgreSQL / 后端容器，仅做流量转发。
# ============================================================================

# 方案 A：独立子域名（推荐，最清晰）
# 用户端（3001）与后台端（3002）分别反代，proxy_pass 必须指向本机 127.0.0.1
# server {
#     listen 80;
#     server_name mentor.yourdomain.com;   # 改成你的域名，并先做好 DNS A 记录指向本服务器
#
#     # —— 用户端（测评）——
#     location / {
#         proxy_pass http://127.0.0.1:3001;
#         proxy_http_version 1.1;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         proxy_intercept_errors on;
#         error_page 404 =200 /index.html;
#     }
# }

# 方案 A-2：后台端（3002）单独反代（若你直接以 IP:端口 或另一子域名访问后台）
# 常见 502 原因就是这里 proxy_pass 写错（写成了旧容器名 / 错误端口 / 漏了 127.0.0.1）
# server {
#     listen 80;
#     server_name admin.yourdomain.com;     # 或保留下面这段直接反代 IP:3002 的端口
#
#     location / {
#         proxy_pass http://127.0.0.1:3002;   # ← 必须是 127.0.0.1:3002
#         proxy_http_version 1.1;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         proxy_intercept_errors on;
#         error_page 404 =200 /index.html;
#     }
# }

# 若不走域名、想直接让 nginx 接管 IP:3002 的反代（避免公网直连 Node 的稳定性问题）：
# server {
#     listen 3002;
#     location / {
#         proxy_pass http://127.0.0.1:3002;
#         proxy_http_version 1.1;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#         proxy_intercept_errors on;
#         error_page 404 =200 /index.html;
#     }
# }

# 方案 B：同域名子路径（如 yourdomain.com/mentor）
# 注意：前端构建需把 base 设为 /mentor/（改 vite.config.js 的 base），否则资源 404。
# server {
#     listen 80;
#     server_name yourdomain.com;
#
#     location /mentor/ {
#         proxy_pass http://127.0.0.1:3001/;
#         proxy_http_version 1.1;
#         proxy_set_header Host $host;
#         proxy_set_header X-Real-IP $remote_addr;
#         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
# }

